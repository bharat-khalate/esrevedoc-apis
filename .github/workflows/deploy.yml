name: BE CI/CD

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Get the code
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Authenticate GitHub Actions with AWS
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::601525366310:role/github-actions-esrevedoc-be
          aws-region: eu-north-1

      # 3. Login to ECR
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # 4. Build Docker image
      - name: Build Docker image
        run: |
          docker build \
            -t 601525366310.dkr.ecr.eu-north-1.amazonaws.com/esrevedoc-be:${{ github.sha }} .

      # 5. Push Docker image to ECR
      - name: Push Docker image
        run: |
          docker push \
            601525366310.dkr.ecr.eu-north-1.amazonaws.com/esrevedoc-be:${{ github.sha }}

      # 6. Deploy to EC2
      - name: Deploy to EC2
        run: |
          aws ssm send-command \
            --instance-ids i-0a1ab87f6cc32a298 \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "set -e",
              "IMAGE=601525366310.dkr.ecr.eu-north-1.amazonaws.com/esrevedoc-be:${{ github.sha }}",
              "aws ecr get-login-password --region eu-north-1 | docker login --username AWS --password-stdin 601525366310.dkr.ecr.eu-north-1.amazonaws.com",
              "docker pull $IMAGE",
              "docker stop esrevedoc-be || true",
              "docker rm esrevedoc-be || true",
              "docker run -d --name esrevedoc-be --restart unless-stopped --env-file /home/ubuntu/esrevedoc-be.env -p 5000:5000 $IMAGE"
            ]' \
            --region eu-north-1
