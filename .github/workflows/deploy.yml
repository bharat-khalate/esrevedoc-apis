name: BE CI/CD

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Get the code
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Authenticate GitHub Actions with AWS
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::601525366310:role/github-actions-esrevedoc-be
          aws-region: eu-north-1

      # 3. Login to ECR
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # 4. Build Docker image
      - name: Build Docker image
        run: |
          docker build \
            --no-cache \
            -f DockerFile \
            -t 601525366310.dkr.ecr.eu-north-1.amazonaws.com/esrevedoc-be:${{ github.sha }} .

      # 5. Push Docker image to ECR
      - name: Push Docker image
        run: |
          docker push \
            601525366310.dkr.ecr.eu-north-1.amazonaws.com/esrevedoc-be:${{ github.sha }}

      # 6. Deploy to EC2 using SSM
      - name: Deploy to EC2
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids i-0a1ab87f6cc32a298 \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "set -e",
              "IMAGE=601525366310.dkr.ecr.eu-north-1.amazonaws.com/esrevedoc-be:${{ github.sha }}",
              "aws ecr get-login-password --region eu-north-1 | docker login --username AWS --password-stdin 601525366310.dkr.ecr.eu-north-1.amazonaws.com",
              "docker pull $IMAGE",
              "aws ssm get-parameter --name /esrevedoc/be/env --with-decryption --query Parameter.Value --output text > /tmp/esrevedoc-be.env",
              "docker stop esrevedoc-be || true",
              "docker rm esrevedoc-be || true",
              "docker run -d --name esrevedoc-be --restart unless-stopped --env-file /tmp/esrevedoc-be.env -p 5000:5000 $IMAGE",
              "rm -f /tmp/esrevedoc-be.env",
              "docker ps"
            ]' \
            --region eu-north-1 \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id i-0a1ab87f6cc32a298

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id i-0a1ab87f6cc32a298 \
            --query "Status" \
            --output text)

          echo "EC2 deployment status: $STATUS"

          if [ "$STATUS" != "Success" ]; then
            echo "EC2 deployment failed."

            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id i-0a1ab87f6cc32a298 \
              --query "StandardErrorContent" \
              --output text

            exit 1
          fi

          echo "EC2 deployment succeeded."
